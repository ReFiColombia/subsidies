specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
# History is copied from the previous deployment instead of being re-read from
# the chain. A full re-index in Studio came back with more than half of the
# Celo events missing (checked against the block explorer on 2026-10-07), while
# the previous deployment has every event. New blocks are indexed normally.
features:
  - grafting
graft:
  base: Qmb6TtJ3e8btLVkwcBYQFktAXJWgRjcYwjHszQ865YvHcv
  block: 79499496
dataSources:
  # V1 (non-upgradeable). Still the contract the frontend uses and the one
  # holding the funds, so it is indexed from its deployment block.
  - kind: ethereum
    name: SubsidyProgramV1
    network: celo
    source:
      address: "0x947C6dB1569edc9fd37B017B791cA0F008AB4946"
      abi: SubsidyProgramV1
      startBlock: 29277553
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Beneficiary
        - Funds
        - DailyClaim
      abis:
        - name: SubsidyProgramV1
          file: ./abis/SubsidyProgramV1.json
      eventHandlers:
        - event: BeneficiaryAdded(indexed address)
          handler: handleBeneficiaryAdded
        - event: BeneficiaryRemoved(indexed address)
          handler: handleBeneficiaryRemoved
        - event: SubsidyClaimed(indexed address,uint256,uint256)
          handler: handleSubsidyClaimed
        - event: FundsAdded(uint256,uint256)
          handler: handleFundsAdded
        - event: FundsWithdrawed(uint256)
          handler: handleFundsWithdrawed
      file: ./src/subsidy-program-v1.ts
  # V2 (UUPS proxy). Deployed but not active yet. Indexed already so the
  # switch to V2 needs no new subgraph deployment.
  - kind: ethereum
    name: SubsidyProgram
    network: celo
    source:
      address: "0xAbE493F082f41B432696F715f84D5471F48cdA2B"
      abi: SubsidyProgram
      startBlock: 51341193
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Beneficiary
        - Funds
        - TokenBalance
        - DailyClaim
      abis:
        - name: SubsidyProgram
          file: ./abis/SubsidyProgram.json
      eventHandlers:
        - event: BeneficiaryAdded(indexed address)
          handler: handleBeneficiaryAdded
        - event: BeneficiaryRemoved(indexed address)
          handler: handleBeneficiaryRemoved
        - event: SubsidyClaimed(indexed address,uint256,uint256)
          handler: handleSubsidyClaimed
        - event: FundsAdded(uint256,address,uint256)
          handler: handleFundsAdded
        - event: FundsWithdrawn(address,uint256)
          handler: handleFundsWithdrawn
        - event: TokenAdded(indexed address,uint256)
          handler: handleTokenAdded
        - event: TokenSwapped(indexed address,uint256,uint256)
          handler: handleTokenSwapped
      file: ./src/subsidy-program.ts
